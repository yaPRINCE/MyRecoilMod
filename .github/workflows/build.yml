name: Build CounterFlameRecoil

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos

      - name: Build
        run: |
          export THEOS=${{ github.workspace }}/theos
          make clean
          make package

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: CounterFlameRecoil
          path: |
            .theos/obj/**/*.dylib
            packages/*.deb
